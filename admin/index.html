<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · ICC Admin</title><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-body"><div class="admin-app"><aside class="admin-side"><div class="admin-brand"><img src="../assets/images/icc-logo-icon.png">ICC Admin</div><nav class="admin-nav"><a class="active" href="index.html">Dashboard</a><a href="majors.html">Majors</a><a href="semesters.html">Semesters</a><a href="subjects.html">Subjects</a><a href="requirements.html">Requirements</a><a href="content.html">Website content</a><a href="settings.html">Settings</a><button data-logout>Logout</button></nav></aside><main class="admin-main"><header class="admin-top"><button class="btn secondary" data-menu>☰</button><span data-admin-email></span></header><section class="admin-content"><div data-admin-loading class="admin-loading">Checking access…</div><div data-dashboard hidden><div class="admin-head"><h1>Dashboard</h1><button class="btn secondary" data-lang-admin>العربية</button></div><div class="cards" data-cards></div><div class="panel"><h2>Quick actions</h2><p><a class="btn" href="majors.html">Add Major</a> <a class="btn" href="semesters.html">Add Semester</a> <a class="btn" href="subjects.html">Add Subject</a></p></div></div></section></main></div><script type="module">import{requireAdmin}from'./js/admin-guard.js';import'./js/admin-layout.js';import{getMajors,getSemesters,getSubjects,getRequirements}from'../js/firestore.js';requireAdmin(async()=>{const a=await Promise.all([getMajors(),getSemesters(),getSubjects(),getRequirements()]);const names=['Majors','Semesters','Subjects','Requirements'];document.querySelector('[data-cards]').innerHTML=a.map((x,i)=>`<div class="card"><div class="metric">${x.length}</div><div class="metric-label">${names[i]}</div></div>`).join('');document.querySelector('[data-dashboard]').hidden=false});</script></body></html>
