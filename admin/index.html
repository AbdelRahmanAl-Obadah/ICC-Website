<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · ICC Admin</title><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-body"><div class="admin-app"><aside class="admin-side"><div class="admin-brand"><img src="../assets/images/icc-logo-icon.png" alt="ICC">ICC Admin</div><nav class="admin-nav" data-admin-nav></nav></aside><main class="admin-main"><header class="admin-top"><button class="btn secondary" data-menu aria-label="Menu"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button><span data-admin-email></span></header><section class="admin-content"><div data-admin-loading class="admin-loading">Checking access…</div><div data-dashboard hidden><div class="admin-head"><h1>Dashboard</h1><button class="btn secondary" data-lang-admin>العربية</button></div><div class="cards" data-cards></div><div class="panel"><h2>Quick actions</h2><p><a class="btn" href="majors.html">Add Major</a> <a class="btn" href="semesters.html">Add Semester</a> <a class="btn" href="subjects.html">Add Subject</a></p></div></div></section></main></div><script type="module">import{requireAdmin}from'./js/admin-guard.js';import'./js/admin-layout.js';import{getMajors,getSemesters,getSubjects,getRequirements}from'../js/firestore.js';requireAdmin(async()=>{const a=await Promise.all([getMajors(),getSemesters(),getSubjects(),getRequirements()]);const names=['Majors','Semesters','Subjects','Requirements'];document.querySelector('[data-cards]').innerHTML=a.map((x,i)=>`<div class="card"><div class="metric">${x.length}</div><div class="metric-label">${names[i]}</div></div>`).join('');document.querySelector('[data-dashboard]').hidden=false});</script></body></html>
