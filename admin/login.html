<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — ICC</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../assets/images/icc-logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/icons.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body" data-page="admin-login">

<div class="admin-login">
  <div class="admin-login__card">
    <img src="../assets/images/icc-logo-lockup.png" class="admin-login__logo" alt="ICC — Innovation & Computing Club">
    <h1 data-i18n="admin_login_title">Admin sign in</h1>
    <p class="lede" data-i18n="admin_login_lede">Sign in to manage ICC's academic data.</p>

    <div class="admin-login__error" data-login-error role="alert"></div>

    <form data-login-form novalidate>
      <div class="form-field" style="margin-bottom:14px;">
        <label for="loginEmail" data-i18n="admin_field_email">Email</label>
        <input type="email" id="loginEmail" name="email" autocomplete="username" required>
      </div>
      <div class="form-field" style="margin-bottom:8px;">
        <label for="loginPassword" data-i18n="admin_field_password">Password</label>
        <input type="password" id="loginPassword" name="password" autocomplete="current-password" required>
      </div>
      <div style="text-align:end; margin-bottom:18px;">
        <button type="button" class="btn btn--ghost" data-forgot-password style="font-size:0.8rem;" data-i18n="admin_forgot_password">Forgot password?</button>
      </div>
      <button type="submit" class="btn btn--primary btn--block" data-login-submit>
        <span data-i18n="admin_sign_in">Sign in</span>
      </button>
    </form>

    <div class="admin-login__divider" data-i18n="admin_or">or</div>

    <button type="button" class="btn btn--google btn--block" data-google-signin>
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.35 0-4.34-1.58-5.05-3.71H.9v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.71A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.71V4.96H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.04l3.05-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.96l3.05 2.33C4.66 5.16 6.65 3.58 9 3.58z"/></svg>
      <span data-i18n="admin_google_signin">Continue with Google</span>
    </button>

    <div class="admin-login__foot">
      <a href="../signup.html" data-i18n="signup_no_account">Need an account? Register</a>
    </div>
  </div>
</div>

<a href="../index.html" class="admin-login__back icon-text">
  <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" data-icon-flip="true" aria-hidden="true" focusable="false"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
  <span data-i18n="admin_back_to_site">Back to the public site</span>
</a>

<script type="module" src="../js/icons.js"></script>
<script src="../js/language.js" defer></script>
<script src="../js/admin/admin-ui.js" defer></script>
<script type="module" src="../js/admin/login.js"></script>
</body>
</html>
