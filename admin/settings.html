<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings · ICC Admin</title><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-body"><main class="admin-content"><a href="index.html">← Dashboard</a><h1>Site settings</h1><div data-admin-loading>Checking access…</div><form class="panel form-grid" data-form hidden><label>Site name<input name="siteName"></label><label>Organization name<input name="organizationName"></label><label>Default language<select name="defaultLanguage"><option value="en">English</option><option value="ar">Arabic</option></select></label><label>Facebook URL<input type="url" name="facebookUrl"></label><label class="wide"><input type="checkbox" name="maintenanceMode"> Enable maintenance mode</label><button class="btn wide">Save settings</button></form></main><script type="module">import{requireAdmin}from'./js/admin-guard.js';import{getSettings,updateSettings}from'../js/firestore.js';const f=document.querySelector('[data-form]');requireAdmin(async()=>{const d=await getSettings();for(const[k,v]of Object.entries(d))if(f[k])f[k].type==='checkbox'?f[k].checked=v:f[k].value=v;f.hidden=false});f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));d.maintenanceMode=f.maintenanceMode.checked;await updateSettings(d);alert('Saved successfully.')};</script></body></html>
