<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings · ICC Admin</title><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-body"><div class="admin-app"><aside class="admin-side"><div class="admin-brand"><img src="../assets/images/icc-logo-icon.png" alt="ICC">ICC Admin</div><nav class="admin-nav" data-admin-nav></nav></aside><main class="admin-main"><header class="admin-top"><button class="btn secondary" data-menu aria-label="Menu"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button><span><b data-admin-name>Administrator</b> · <span data-admin-email></span></span></header><section class="admin-content"><div class="admin-loading" data-admin-loading>Checking access…</div><div data-settings-app hidden><div class="admin-head"><div><h1>Site settings</h1><p class="admin-lede">General configuration for the public website.</p></div></div><div data-notice aria-live="polite"></div><form class="panel form-grid" data-form><label>Site name<input name="siteName"></label><label>Organization name<input name="organizationName"></label><label>Default language<select name="defaultLanguage"><option value="en">English</option><option value="ar">Arabic</option></select></label><label>Facebook URL<input type="url" name="facebookUrl"></label><label class="wide"><input type="checkbox" name="maintenanceMode"> Enable maintenance mode</label><div class="wide content-actions"><span>Changes apply to the public website immediately.</span><button class="btn" type="submit">Save settings</button></div></form></div></section></main></div><script type="module" src="./js/admin-layout.js"></script><script type="module" src="./js/admin-settings.js"></script></body></html>
