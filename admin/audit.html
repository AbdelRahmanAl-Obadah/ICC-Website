<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Logs — ICC Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../assets/images/icc-logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body" data-page="admin-audit">

<!-- Auth gate: shown until admin-guard.js confirms an authorized admin who
     actually holds the "audit" permission. The shell below stays
     visibility:hidden until then, and firestore.rules reject unauthorized
     reads and writes regardless of what happens in the browser. -->
<div class="admin-gate" data-admin-gate>
  <div class="admin-gate__spinner" aria-hidden="true"></div>
  <p data-i18n="admin_checking_access">Checking your access…</p>
</div>

<div class="admin-shell" data-admin-shell style="visibility:hidden;">

  <aside class="admin-sidebar" data-admin-sidebar>
    <a href="index.html" class="admin-sidebar__brand">
      <img src="../assets/images/icc-logo-icon.png" alt="ICC">
      <span data-i18n="admin_panel_label">Admin Panel</span>
    </a>

    <nav class="admin-nav" data-admin-nav aria-label="Admin">
      <!-- Rendered by js/admin/admin-nav.js from the signed-in user's
           permissions. A Super Admin sees every section; an Admin sees
           only what they are authorized to manage. -->
    </nav>

    <div class="admin-sidebar__foot">
      <div class="lang-switch" role="group" aria-label="Language" style="margin-bottom:12px;">
        <button type="button" data-lang-btn="en">EN</button>
        <button type="button" data-lang-btn="ar">AR</button>
      </div>
      <div class="admin-sidebar__user">
        <strong data-admin-user-name>—</strong>
        <span data-admin-user-email></span>
        <span class="badge" data-admin-role-badge></span>
      </div>
      <button type="button" class="admin-sidebar__signout" data-admin-signout data-i18n="admin_sign_out">Sign out</button>
      <a href="../index.html" class="admin-sidebar__signout" style="display:block; text-align:center; margin-top:8px; text-decoration:none;" data-i18n="admin_back_to_site">← Back to the public site</a>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <button type="button" class="admin-burger" data-admin-burger aria-label="Menu"><span></span></button>
      <div>
        <h1 data-i18n="admin_audit_title">Audit Logs</h1>
        <p data-i18n="admin_audit_lede">A complete history of every administrator action on the platform.</p>
      </div>
      <div class="admin-topbar__actions">
        <button type="button" class="btn btn--outline" data-export-btn><span data-i18n="admin_audit_export">Export CSV</span></button>
      </div>
    </div>

    <div class="admin-content">
      <section class="admin-panel">
        <div class="admin-panel__body">
          <div class="admin-toolbar admin-toolbar--wrap">
            <input type="search" data-search data-i18n-attr="placeholder:admin_audit_search_placeholder" placeholder="Search actor, record or change…" aria-label="Search">
            <select data-section-filter aria-label="Resource">
              <option value="" data-i18n="admin_filter_all_sections">All resources</option>
            </select>
            <select data-action-filter aria-label="Action">
              <option value="" data-i18n="admin_filter_all_actions">All actions</option>
            </select>
            <select data-actor-filter aria-label="Admin">
              <option value="" data-i18n="admin_filter_all_admins">All admins</option>
            </select>
            <label class="admin-toolbar__date">
              <span data-i18n="admin_filter_from">From</span>
              <input type="date" data-date-from aria-label="From date">
            </label>
            <label class="admin-toolbar__date">
              <span data-i18n="admin_filter_to">To</span>
              <input type="date" data-date-to aria-label="To date">
            </label>
            <select data-sort aria-label="Sort">
              <option value="desc" data-i18n="admin_sort_newest">Newest first</option>
              <option value="asc" data-i18n="admin_sort_oldest">Oldest first</option>
            </select>
            <button type="button" class="btn btn--outline btn--xs" data-clear-filters data-i18n="admin_filter_clear">Clear filters</button>
          </div>

          <div data-state-mount></div>

          <div class="admin-table-wrap">
            <table class="admin-table" data-table hidden>
              <thead>
                <tr>
                  <th><span data-i18n="admin_field_when">When</span></th>
                  <th class="wrap"><span data-i18n="admin_field_actor">Who</span></th>
                  <th><span data-i18n="admin_field_action">Action</span></th>
                  <th><span data-i18n="admin_field_resource">Resource</span></th>
                  <th class="wrap"><span data-i18n="admin_field_record">Record</span></th>
                  <th><span data-i18n="admin_actions">Details</span></th>
                </tr>
              </thead>
              <tbody data-table-body></tbody>
            </table>
          </div>

          <div class="admin-loadmore">
            <button type="button" class="btn btn--outline" data-load-more hidden><span data-i18n="admin_load_more">Load more</span></button>
          </div>
        </div>
      </section>
    </div>
  </main>

</div>

<script src="../js/language.js" defer></script>
<script src="../js/admin/admin-ui.js" defer></script>
<script type="module" src="../js/admin/audit-admin.js"></script>
</body>
</html>
