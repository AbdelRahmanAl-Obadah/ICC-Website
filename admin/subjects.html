<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subjects — ICC Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../assets/images/icc-logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body" data-page="admin-subjects">

<!-- Auth gate: shown until admin-guard.js confirms an authorized admin.
     The shell below stays visibility:hidden until then, and Firestore
     rules reject unauthorized reads regardless. -->
<div class="admin-gate" data-admin-gate>
  <div class="admin-gate__spinner" aria-hidden="true"></div>
  <p data-i18n="admin_checking_access">Checking your access…</p>
</div>

<div class="admin-shell" data-admin-shell style="visibility:hidden;">

  <aside class="admin-sidebar" data-admin-sidebar>
    <a href="index.html" class="admin-sidebar__brand">
      <img src="../assets/images/icc-logo-icon.png" alt="ICC">
      <span data-i18n="admin_panel_label">Admin Panel</span>
    </a>

    <nav class="admin-nav" data-admin-nav aria-label="Admin">
      <!-- Rendered by js/admin/admin-nav.js from the signed-in user's
           permissions. A Super Admin sees every section; an Admin sees
           only what they are authorized to manage. -->
    </nav>

    <div class="admin-sidebar__foot">
      <div class="lang-switch" role="group" aria-label="Language" style="margin-bottom:12px;">
        <button type="button" data-lang-btn="en">EN</button>
        <button type="button" data-lang-btn="ar">AR</button>
      </div>
      <div class="admin-sidebar__user">
        <strong data-admin-user-name>—</strong>
        <span data-admin-user-email></span>
        <span class="badge" data-admin-role-badge></span>
      </div>
      <button type="button" class="admin-sidebar__signout" data-admin-signout data-i18n="admin_sign_out">Sign out</button>
      <a href="../index.html" class="admin-sidebar__signout" style="display:block; text-align:center; margin-top:8px; text-decoration:none;" data-i18n="admin_back_to_site">← Back to the public site</a>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <button type="button" class="admin-burger" data-admin-burger aria-label="Menu"><span></span></button>
      <div>
        <h1 data-i18n="admin_subjects_title">Subjects</h1>
        <p data-i18n="admin_subjects_lede">Manage every subject/course, organized by major and semester.</p>
      </div>
      <div class="admin-topbar__actions">
        <button type="button" class="btn btn--primary" data-add-btn><span data-i18n="admin_add">Add</span></button>
      </div>
    </div>

    <div class="admin-content">
      <section class="admin-panel">
        <div class="admin-panel__body">
          <div class="admin-toolbar">
            <input type="search" data-search class="admin-toolbar__search"
                   aria-label="Search" data-i18n-attr="placeholder:admin_search_placeholder" placeholder="Search…">
            <select data-major-filter aria-label="Major">
              <option value="all" data-i18n="admin_filter_all_majors">All majors</option>
            </select>
            <select data-specialization-filter aria-label="Specialization">
              <option value="all" data-i18n="admin_filter_all_specializations">All specializations</option>
            </select>
            <select data-year-filter aria-label="Academic year">
              <option value="all" data-i18n="admin_filter_all_years">All years</option>
            </select>
            <select data-semester-filter aria-label="Semester">
              <option value="all" data-i18n="admin_filter_all">All</option>
            </select>
            <select data-type-filter aria-label="Requirement type">
              <option value="all" data-i18n="admin_filter_all_types">All types</option>
            </select>
            <select data-status-filter aria-label="Status">
              <option value="all" data-i18n="admin_filter_all">All</option>
              <option value="active" data-i18n="admin_active">Active</option>
              <option value="inactive" data-i18n="admin_inactive">Inactive</option>
            </select>
            <select data-sort aria-label="Sort by">
              <option value="order" data-i18n="admin_sort_order">Curriculum order</option>
              <option value="name" data-i18n="admin_sort_name">Name</option>
              <option value="code" data-i18n="admin_sort_code">Code</option>
              <option value="credits" data-i18n="admin_sort_credits">Credit hours</option>
            </select>
            <button type="button" class="btn btn--ghost btn--sm" data-clear-filters data-i18n="admin_clear_filters">Clear filters</button>
          </div>

          <div data-state-mount></div>

          <div class="admin-table-wrap">
            <table class="admin-table" data-table hidden>
              <thead>
                <tr>
                  <th><span data-i18n="admin_field_display_order">Order</span></th>
                  <th class="wrap"><span data-i18n="admin_field_name">Name</span></th>
                  <th><span data-i18n="admin_field_code">Code</span></th>
                  <th class="wrap"><span data-i18n="admin_field_major">Major</span></th>
                  <th class="wrap"><span data-i18n="admin_field_specialization">Specialization</span></th>
                  <th class="wrap"><span data-i18n="admin_field_semester">Semester</span></th>
                  <th><span data-i18n="admin_field_credit_hours">Credits</span></th>
                  <th class="wrap"><span data-i18n="admin_field_prerequisites">Prerequisites</span></th>
                  <th><span data-i18n="admin_status">Status</span></th>
                  <th><span data-i18n="admin_actions">Actions</span></th>
                </tr>
              </thead>
              <tbody data-table-body></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>

</div>

<script src="../js/language.js" defer></script>
<script src="../js/admin/admin-ui.js" defer></script>
<script type="module" src="../js/admin/subjects-admin.js"></script>
</body>
</html>
