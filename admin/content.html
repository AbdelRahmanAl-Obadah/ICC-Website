<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content · ICC Admin</title><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-body"><main class="admin-content"><a href="index.html">← Dashboard</a><h1>Website content</h1><div data-admin-loading>Checking access…</div><form class="panel form-grid" data-form hidden><label>Hero title (English)<input name="heroTitleEn"></label><label>Hero title (Arabic)<input name="heroTitleAr"></label><label class="wide">Hero description (English)<textarea name="heroDescriptionEn"></textarea></label><label class="wide">Hero description (Arabic)<textarea name="heroDescriptionAr"></textarea></label><label>About title (English)<input name="aboutTitleEn"></label><label>About title (Arabic)<input name="aboutTitleAr"></label><label class="wide">Footer (English)<textarea name="footerEn"></textarea></label><label class="wide">Footer (Arabic)<textarea name="footerAr"></textarea></label><button class="btn wide">Save content</button></form></main><script type="module">import{requireAdmin}from'./js/admin-guard.js';import{getSiteContent,updateSiteContent}from'../js/firestore.js';const f=document.querySelector('[data-form]');requireAdmin(async()=>{const d=await getSiteContent();for(const[k,v]of Object.entries(d))if(f[k])f[k].value=v;f.hidden=false});f.onsubmit=async e=>{e.preventDefault();await updateSiteContent(Object.fromEntries(new FormData(f)));alert('Saved successfully.')};</script></body></html>
